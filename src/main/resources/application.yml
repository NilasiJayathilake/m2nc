spring:
  application:
    name: M2NC
  profiles:
    active: local
  data:
    mongodb:
      auto-index-creation: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/m2nc}
jwt:
  secret: ${JWT_SECRET:default-secret-key-that-must-be-at-least-32-characters-long}
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000
server:
  servlet:
    context-path: /api